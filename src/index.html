<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مورد الظمآن">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>مورد الظمآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Warsh";src:url("warsh.woff2") format("woff2");font-display:swap}
:root{
  --mp:#f8f0dc; --mink:#2b2117; --mline:#e6d9b8;
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1d1b16; --muted:#6f6656; --line:#e4dccb;
  --green:#1f3b2d; --green2:#2f5a44; --accent:#a3271f; --gold:#b98a2e; --hl:#fbeec2;
  --chip:#efe7d6; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.06);
  --fs:21px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141612; --paper:#1c1f1a; --ink:#ece6d8; --muted:#a59d8b; --line:#2f332b;
  --green:#7fb596; --green2:#9cc8ad; --accent:#ef7a6c; --gold:#d8b062; --hl:#4a3f1c; --chip:#272b24;
  --shadow:none; --mp:#221f18; --mink:#e3d8c0; --mline:#3a3427;
}}
:root[data-theme="dark"]{
  --bg:#141612; --paper:#1c1f1a; --ink:#ece6d8; --muted:#a59d8b; --line:#2f332b;
  --green:#7fb596; --green2:#9cc8ad; --accent:#ef7a6c; --gold:#d8b062; --hl:#4a3f1c; --chip:#272b24;
  --shadow:none; --mp:#221f18; --mink:#e3d8c0; --mline:#3a3427;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;font-size:var(--ui,16px);line-height:1.7;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
:root[data-theme="dark"] header{background:#10251a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#10251a}}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.brand h1{margin:0;font-family:Amiri,serif;font-size:26px;font-weight:700;letter-spacing:0}
.brand small{opacity:.75;font-size:13px;flex:1}
.fz{display:flex;gap:6px;align-self:center}
.fz button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;min-width:40px;height:34px;padding:0 8px;
  font-family:Amiri,serif;font-weight:700;line-height:1}
.fz button:active{background:rgba(255,255,255,.3)}
.fz .s{font-size:15px}.fz .l{font-size:22px}
.fz .b{font-size:18px;font-weight:400}
:root.bold .fz .b{font-weight:700;background:rgba(255,255,255,.34)}
/* الخط العريض الداكن */
:root.bold{--ink:#0d0a06; --mink:#140d06; --muted:#4d4537}
:root.bold body{font-weight:600}
:root.bold .bayt{font-weight:700}
:root.bold .aya .at,:root.bold .form .w{-webkit-text-stroke:.016em currentColor}
:root.bold .vimg img{filter:url(#thk);opacity:1}
@media (prefers-color-scheme:dark){:root.bold:not([data-theme="light"]){--ink:#f7f2e8; --mink:#f3ead6; --muted:#c2b9a5}
 :root.bold:not([data-theme="light"]) .vimg img{filter:url(#thk) invert(.9) sepia(.2)}}
:root.bold[data-theme="dark"]{--ink:#f7f2e8; --mink:#f3ead6; --muted:#c2b9a5}
:root.bold[data-theme="dark"] .vimg img{filter:url(#thk) invert(.9) sepia(.2)}
.searchbox{margin-top:10px;position:relative}
.searchbox input{width:100%;border:0;border-radius:12px;padding:12px 44px 12px 14px;font-size:18px;
  font-family:inherit;background:#fffdf8;color:#1d1b16;outline:none}
.searchbox .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;
  font-size:20px;color:#888;padding:6px 8px;display:none}
.searchbox .ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
main{max-width:860px;margin:0 auto;padding:14px 16px}
.view{display:none}.view.on{display:block}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--paper);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:12.5px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--green)}
.hint{color:var(--muted);font-size:14px;margin:6px 2px 12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:12px 14px 10px;margin:0 0 12px}
.vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.vnum{background:var(--green);color:#fff;border-radius:999px;min-width:30px;padding:0 8px;text-align:center;
  font-weight:700;font-size:13px;line-height:24px}
:root[data-theme="dark"] .vnum{color:#10251a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vnum{color:#10251a}}
.vsec{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{border:0;background:none;padding:4px 6px;color:var(--muted);border-radius:8px}
.vbtn.on{color:var(--gold)}
/* البيت: الصدر يمينًا والعجز يسارًا */
.bayt{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;font-family:Amiri,serif;font-size:var(--fs);
  line-height:1.9;padding:4px 0 2px}
.bayt .sadr{text-align:right}
.bayt .ajz{text-align:left}
.bayt.small{font-size:calc(var(--fs) - 3px)}
.q{color:var(--accent)}
.hit{background:var(--hl);border-radius:4px;box-shadow:0 0 0 2px var(--hl)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:3px 11px;font-size:14px;color:var(--ink);
  font-family:inherit}
.chip.q{color:var(--accent)}
.grp{font-weight:700;color:var(--green);margin:16px 2px 8px;font-size:15px}
.rule{border-inline-start:4px solid var(--gold)}
.rule p{margin:2px 0 6px;font-size:15px}
.count{color:var(--muted);font-size:14px;margin:2px 2px 10px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
details.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .rng{font-size:12.5px;color:var(--muted);white-space:nowrap}
details.sec>summary .tt{flex:1;font-weight:600}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.secbody{padding:6px 14px 4px}
.row{border-bottom:1px dashed var(--line);padding:6px 0}
.row:last-child{border-bottom:0}
.row .vhead{margin:0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-family:Amiri,serif;font-size:22px;color:var(--ink);margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 10px}
.navrow{display:flex;gap:8px;margin-top:10px}
.navrow button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px}
.ctx .row{opacity:.6}
.ctx .row.cur{opacity:1}
.set{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.set .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.set .it:last-child{border-bottom:0}
.set .it span{color:var(--muted);font-size:14px}
.mini{display:flex;gap:6px}
.mini button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 12px}
.mini button.on{background:var(--green);color:#fff;border-color:var(--green)}
.about{font-size:14.5px;color:var(--muted)}
.about b{color:var(--ink)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:#222;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.on{opacity:.92}
@media (max-width:420px){
  :root{--fs:17px}
  .bayt{column-gap:12px}
  .brand small{display:none}
  .brand h1{flex:1}
  main{padding:12px 12px}
}
@media (min-width:900px){ :root{--fs:23px} }

/* ---- المصحف ---- */
.mus{background:var(--mp);color:var(--mink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin:0 0 14px;
  border-top:4px solid var(--green)}
.mus h3{margin:0 0 4px;font-size:14px;color:var(--green);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.mus h3 span{color:var(--muted);font-weight:400}
.forms{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.form{border:1px solid var(--mline);background:transparent;border-radius:12px;padding:2px 12px 0;display:flex;align-items:baseline;gap:6px;color:var(--ink)}
.form.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.form .w{font-family:Warsh,Amiri,serif;font-size:calc(var(--fs) + 9px);line-height:1.9;color:var(--mink)}
.form small{color:var(--muted);font-size:12px}
.aya{border-top:1px solid var(--mline);padding:10px 0 6px}
.aya .at{font-family:Warsh,Amiri,serif;font-size:calc(var(--fs) + 6px);line-height:2.5;text-align:justify;color:var(--mink);word-spacing:2px}
.aya .at .hit{color:var(--accent);background:none;box-shadow:none;border-bottom:2px solid var(--accent);padding-bottom:2px}
.aya .ar{font-size:12.5px;color:var(--muted)}
.more{width:100%;border:1px solid var(--mline);background:transparent;border-radius:10px;padding:8px;margin-top:6px;color:var(--green)}
.sep{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:700;margin:4px 2px 10px;font-size:15px}
.sep:after{content:"";flex:1;border-top:1px solid var(--line)}
/* ---- الشروح ---- */
.shl{display:flex;flex-direction:column;gap:8px}
.shb{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:1px solid var(--line);background:var(--paper);
  border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.shb .ic{flex:none;width:34px;height:42px;border-radius:4px 8px 8px 4px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:Amiri,serif;font-size:18px;font-weight:700}
:root[data-theme="dark"] .shb .ic{color:#10251a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shb .ic{color:#10251a}}
.shb .tx{flex:1;min-width:0}
.shb .tx b{display:block;font-family:Amiri,serif;font-size:18px;line-height:1.4}
.shb .tx span{font-size:13px;color:var(--muted)}
.shb .go{color:var(--muted);font-size:20px}
.shnote{font-size:13px;color:var(--muted);margin:6px 2px 0}
.viewer{position:fixed;inset:0;z-index:70;background:#f4ecd8;display:none;flex-direction:column}
.viewer.on{display:flex}
.vtop{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.vtop .t{flex:1;min-width:0;line-height:1.3}
.vtop .t b{display:block;font-family:Amiri,serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .t span{font-size:12.5px;opacity:.8}
.vtop button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:6px 11px;font-size:15px}
.vimg{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#f4ecd8;touch-action:pan-x pan-y pinch-zoom}
.vimg img{display:block;width:100%;max-width:900px;margin:0 auto;min-height:40vh;mix-blend-mode:multiply;opacity:.88}
:root[data-theme="dark"] .vimg,:root[data-theme="dark"] .viewer{background:#1b1914}
:root[data-theme="dark"] .vimg img{mix-blend-mode:normal;filter:invert(.86) sepia(.25);opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vimg,:root:not([data-theme="light"]) .viewer{background:#1b1914}
 :root:not([data-theme="light"]) .vimg img{mix-blend-mode:normal;filter:invert(.86) sepia(.25);opacity:1}}
.vimg.zoom img{width:190%;max-width:none}
.vimg .ld{color:#888;text-align:center;padding:40px 10px;font-size:15px}
.vchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0;background:#f6f1e7;color:#1d1b16;font-size:13px;align-items:center}
.vchips:empty{display:none}
.vchips .chip{background:#efe7d6;color:#1d1b16}
.vbot{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#f6f1e7;border-top:1px solid #e4dccb}
.vbot button{flex:1;border:1px solid #e4dccb;background:#fffdf8;color:#1d1b16;border-radius:10px;padding:10px 4px;font-size:15px}
.vbot button:disabled{opacity:.4}
.vbot input{width:74px;text-align:center;border:1px solid #e4dccb;border-radius:10px;font:inherit;font-size:15px;background:#fffdf8;color:#1d1b16}
.dl{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl .tx{flex:1}.dl .tx span{display:block;color:var(--muted);font-size:13px}
.dl button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 12px;white-space:nowrap}
.dl button.ok{color:var(--green);border-color:var(--green)}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>مورد الظمآن</h1><small>الرسم والضبط · رواية ورش</small>
    <div class="fz"><button class="s" data-fz="-1" aria-label="تصغير الخط">أ−</button><button class="l" data-fz="1" aria-label="تكبير الخط">أ+</button><button class="b" data-bold aria-label="خط عريض">ع</button></div></div>
  <div class="searchbox">
    <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f3b2d" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="اكتب كلمة قرآنية…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clr" id="clr" aria-label="مسح">×</button>
  </div>
</header>

<main>
  <section class="view on" id="v-search">
    <div id="results"></div>
  </section>
  <section class="view" id="v-browse">
    <div class="seg" id="seg">
      <button data-b="r" class="on">الرسم</button>
      <button data-b="d">الضبط</button>
      <button data-b="i">الإعلان</button>
    </div>
    <div id="browse"></div>
  </section>
  <section class="view" id="v-saved"><div id="saved"></div></section>
  <section class="view" id="v-set"><div id="settings"></div></section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="search" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>البحث</button>
  <button data-v="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>المتن</button>
  <button data-v="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>المحفوظات</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
</nav>

<div class="sheet" id="sheet"><div class="bd" id="sheetbd"></div><div class="pn" id="sheetpn"></div></div>
<div class="viewer" id="viewer">
  <div class="vtop"><div class="t"><b id="vt"></b><span id="vs"></span></div><button id="vz" aria-label="تكبير">تكبير</button><button id="vx" aria-label="إغلاق">✕</button></div>
  <div class="vimg" id="vimg"></div>
  <div class="vchips" id="vch"></div>
  <div class="vbot"><button id="vprev">→ السابقة</button><input id="vin" inputmode="numeric" aria-label="رقم الصفحة"><button id="vnext">التالية ←</button></div>
</div>
<div class="toast" id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="thk"><feMorphology operator="erode" radius="0.3"/></filter></svg>

<script>
const APP_VERSION = "2.0";
const DATA = /*DATA*/null;

// ---- normalization -------------------------------------------------------
const HAR = /[ؐ-ًؚ-ٟۖ-ۭـ]/g;
function A(s){ // imla'i-ish key: no diacritics, unified alef/hamza seats
  return (s||"").replace(/ٰ/g,"ا").replace(HAR,"")
    .replace(/ے/g,"ي").replace(/[أإآٱ]/g,"ا").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ء/g,"")
    .replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^ء-ي ]/g,"").replace(/\s+/g," ").trim();
}
function K(s){ return A(s).replace(/[اوي ]/g,""); } // consonantal skeleton
function strips(w){ // word variants without proclitics
  const out=new Set([w]); let cur=[w];
  for(const re of [/^[وف](?=..)/, /^[بلك](?=..)/, /^ال(?=..)/, /^لل(?=..)/]){
    const nx=[]; for(const c of cur){ const m=c.replace(re,""); if(m!==c){out.add(m);nx.push(m)} nx.push(c) } cur=nx;
  }
  return [...out];
}

// ---- verse model ---------------------------------------------------------
// id: "m:12" (مورد/ذيل) or "i:7" (الإعلان)
const V = [];
DATA.m.forEach((r,i)=>V.push({id:"m:"+(i+1),bk:"m",n:i+1,s:r[0],a:r[1],w:r[2]}));
DATA.i.forEach((r,i)=>V.push({id:"i:"+(i+1),bk:"i",n:i+1,s:r[0],a:r[1],w:r[2]}));
const byId = Object.fromEntries(V.map(v=>[v.id,v]));

// ---- المصحف: نص مجمع الملك فهد برواية ورش --------------------------------
const Q = {data:null, tok:null, loading:null};
function loadQ(){
  if(Q.loading) return Q.loading;
  Q.loading = fetch("quran.json").then(r=>r.json()).then(d=>{
    Q.data=d; Q.tok=d.a.map(r=>r[2].split(" ").map(t=>{ const a=A(t), r=A(t.replace(/ٰ/g,"")), m=A(t.replace(/و([ًَ-ْ]*)ٰ/g,"ا$1")); // m: الإملائي (الصلوٰة ← الصلاة)
    const vs0=a?[...strips(a),...strips(r),...strips(m)]:[]; const vs=[...new Set(vs0.concat(vs0.filter(x=>/^لل./.test(x)).map(x=>"ا"+x.slice(1))))]; const hf=[...new Set([H(t),H(t.replace(/ٰ/g,"")),H(t.replace(/و([ًَ-ْ]*)ٰ/g,"ا$1"))])].filter(Boolean); const hv0=hf.flatMap(strips); const hv=[...new Set(hv0.concat(hv0.filter(x=>/^لل./.test(x)).map(x=>"ا"+x.slice(1))))];
    return {a, full:[a,r,m], vs, hf, hv, hsk:hv.map(SK)} }));
    if(state.view==="search") renderSearch();
  }).catch(()=>{ Q.loading=null });
  return Q.loading;
}
// مواضع الكلمة: المطابقة التامة أولًا، وإلا فبنفس الهيكل (كالصلوة = الصلاة)
// ---- مطابقة الكتابة الإملائية بالرسم ----
// H: صورة الكلمة بحروفها، والهمز كله «ء»، لمقارنة الإملاء بالرسم حرفًا حرفًا
function H(s){
  return (s||"").replace(/[ٕٔ]/g,"ء").replace(HAR,"").replace(/ے/g,"ي").replace(/آ/g,"ءا").replace(/[أإؤئ]/g,"ء").replace(/ٱ/g,"ا")
    .replace(/ة/g,"ه").replace(/[^ء-ي]/g,"");
}
const SK = s=>s.replace(/[اويىء]/g,"").replace(/ه$/,"ت");
// الفروق المقبولة بين الإملاء والرسم: زيادة الألف أو الهمزة أو حذفهما، والألف واوًا أو ياءً (الصلوٰة، موسىٰ)،
// وكرسي الهمزة، وتكرار الواو أو الياء (داوود، بأييد)، والتاء المربوطة مفتوحة (رحمت)
function subOK(x,y){ const p=x+y; return /^(ءا|اء|ءو|وء|ءي|يء|ىا|اى|ىي|يى)$/.test(p) }
// tok: الحرف زائد في المصحف عمّا كتبه المستخدم
function indelOK(s,i,tok){ const c=s[i];
  if(c==="ء") return tok;                       // همزة في المصحف لم تُكتب في البحث
  if(c==="ا") return i>0 && i<s.length-1;       // ألف محذوفة أو مزيدة في وسط الكلمة
  if(c==="و"||c==="ي"){ const a=s[i-1], b=s[i+1]; return a==="ء"||b==="ء"||a===c||b===c } return false }
function ed(s,t,cap){
  const n=s.length, m=t.length; if(Math.abs(n-m)>cap) return 99;
  let prev=new Array(m+1).fill(99); prev[0]=0;
  for(let j=1;j<=m;j++) prev[j]= indelOK(t,j-1,false)? prev[j-1]+1 : 99;
  for(let i=1;i<=n;i++){ const cur=new Array(m+1).fill(99);
    cur[0]= indelOK(s,i-1,true)? prev[0]+1 : 99; let best=cur[0];
    for(let j=1;j<=m;j++){
      let v=99; const x=s[i-1], y=t[j-1];
      if(x===y) v=prev[j-1];
      else if(subOK(x,y) || (i===n&&j===m&&/[هت]/.test(x)&&/[هت]/.test(y))) v=prev[j-1]+1;
      if(indelOK(s,i-1,true)) v=Math.min(v,prev[j]+1);
      if(indelOK(t,j-1,false)) v=Math.min(v,cur[j-1]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>cap) return 99; prev=cur;
  }
  return prev[m];
}
function findQ(raw){
  const qa=A(raw).replace(/ /g,""); if(!qa||!Q.tok) return null;
  const qv=strips(qa), qh=H(raw), qhv=strips(qh), qsk=SK(qh), qskv=qhv.map(SK);
  const cap = Math.min(...qhv.map(x=>x.length)) <= 6 ? 1 : 2; // كلمة قصيرة: فرق واحد فقط
  const fz=(x,q)=> ed(x,q,cap)<=cap;
  const hits=[], seen=new Set();
  const add=(i,j,j2,key,ex)=>{ const id=i+":"+j; if(seen.has(id)) return; seen.add(id); hits.push([i,j,j2,key,ex]) };
  Q.tok.forEach((ts,i)=>ts.forEach((t,j)=>{
    if(!t.a) return;
    // 1) مطابقة تامة: الكلمة كما كُتبت، أو بعد نزع «و/ف/ب/ل/ك/ال»
    if(t.vs.includes(qa) || t.full.some(x=>qv.includes(x))) return add(i,j,j,t.a,1);
    // 2) مكتوبة إملائيًا: يختلف الرسم في الألف أو الهمز أو حروف المد أو التاء فقط
    if(t.hv.some((x,k)=>t.hsk[k]===qsk && fz(x,qh)) || t.hf.some(x=>{ const sk=SK(x); return qhv.some((q,k)=>qskv[k]===sk && fz(x,q)) })) add(i,j,j,t.a,0);
  }));
  // 3) ما يُكتب كلمة واحدة في أحدهما وكلمتين في الآخر (يبنؤم، لكيلا…): كل كلمتين متتاليتين
  if((!hits.length || /\s/.test(raw.trim())) && qa.length>=4) Q.tok.forEach((ts,i)=>{ for(let j=0;j+1<ts.length;j++){ const a=ts[j].a+ts[j+1].a; if(!a) continue;
      const hh=ts[j].hf[0]+ts[j+1].hf[0];
      if(strips(a).includes(qa)||qv.includes(a)||(SK(hh)===qsk&&fz(hh,qh))) add(i,j,j+1,ts[j].a+" "+ts[j+1].a,1) } });
  hits.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);
  const forms=new Map();
  for(const [i,j,j2,key,ex] of hits){ const ws=Q.data.a[i][2].split(" ").slice(j,j2+1).map(w=>w.split(" ")[0].replace(/[ۖ-ۜ۞۩]/g,"")).join(" ");
    if(!forms.has(key)) forms.set(key,{w:ws,key,n:0,ex}); forms.get(key).n++ }
  return {hits, forms:[...forms.values()].sort((x,y)=>y.ex-x.ex||y.n-x.n), loose:!hits.some(x=>x[4])};
}
let QF = {form:null, lim:12};
function quranHTML(raw){
  if(!Q.tok){ loadQ(); return `<div class="mus"><h3>في المصحف</h3><div class="hint">جارٍ تحميل المصحف…</div></div>` }
  const r=findQ(raw); if(!r) return "";
  if(!r.hits.length) return `<div class="mus"><h3>في المصحف <span>رواية ورش</span></h3><div class="hint">لم أجد هذه الكلمة في المصحف بهذه الصيغة. جرّب كتابتها دون «و» أو «ف» أو «ال»، أو بصيغة أخرى.</div></div>`;
  const hits = QF.form ? r.hits.filter(x=>x[3]===QF.form) : r.hits;
  const ayat=[]; const seen=new Map();
  for(const [i,j,j2] of hits){ if(!seen.has(i)){ seen.set(i,new Set()); ayat.push(i) } for(let k=j;k<=j2;k++) seen.get(i).add(k) }
  const n=ayat.length;
  let h=`<div class="mus"><h3>في المصحف <span>رواية ورش · ${hits.length.toLocaleString("ar-EG")} موضعًا في ${n.toLocaleString("ar-EG")} آية</span></h3>`;
  if(r.loose) h+=`<div class="hint" style="margin:2px 0">هكذا رُسمت في المصحف:</div>`;
  if(r.forms.length>1 || r.loose) h+=`<div class="forms">${r.forms.slice(0,14).map(f=>`<button class="form${QF.form===f.key?" on":""}" data-form="${esc(f.key)}"><span class="w">${esc(f.w)}</span><small>${f.n.toLocaleString("ar-EG")}</small></button>`).join("")}</div>`;
  else h+=`<div class="forms"><span class="form" style="cursor:default"><span class="w">${esc(r.forms[0].w)}</span></span></div>`;
  h+=ayat.slice(0,QF.lim).map(i=>{ const [s,a,t,pg]=Q.data.a[i]; const js=seen.get(i);
    const tx=t.split(" ").map((w,j)=>js.has(j)?w.split("\u00a0").map((x,k)=>k?esc(x):`<span class="hit">${esc(x)}</span>`).join("\u00a0"):esc(w)).join(" ");
    return `<div class="aya"><div class="at">${tx}</div><div class="ar">سورة ${esc(Q.data.n[s-1])} · الآية ${a.toLocaleString("ar-EG")} · ص ${(+pg).toLocaleString("ar-EG")}</div></div>` }).join("");
  if(n>QF.lim) h+=`<button class="more" data-more>عرض ${Math.min(n-QF.lim,40).toLocaleString("ar-EG")} آية أخرى (بقي ${(n-QF.lim).toLocaleString("ar-EG")})</button>`;
  return h+`</div>`;
}

// ---- search --------------------------------------------------------------
function near(a,b,minLen,ratio){ // substring with enough overlap
  const [s,l]=a.length<=b.length?[a,b]:[b,a];
  return s.length>=minLen && l.includes(s) && s.length/l.length>=ratio;
}
function scoreWord(qv, qk, key){
  let best=0;
  for(const q of qv) for(const w of key.v){
    if(q===w) best=Math.max(best, q===qv[0]&&w===key.v[0]?100:95);
    else if(near(q,w,4,.6)) best=Math.max(best,50);
  }
  if(best<90) for(const q of qv) if(key.parts.includes(q)) best=Math.max(best,90); // كلمة من عبارة: «يدع» في «يوم يدع»
  if(best<85){
    if(qk.length>=2 && qk===key.k) best=Math.max(best, qk.length>=4?85:qk.length===3?70:50); // نفس الهيكل: الصلوة = الصلاة
    else for(const q of qv){ const k=K(q);
      for(const w of key.v){ const kw=K(w);
        if(k.length>=3 && k===kw) best=Math.max(best,60);
        else if(near(k,kw,4,.7)) best=Math.max(best,35);
      }
    }
  }
  return best;
}
function search(raw){
  const qa=A(raw); if(!qa) return {hits:[],rules:[]};
  const multi = qa.includes(" ");
  const qv = strips(qa), qk=K(qa);
  const hits=[];
  for(const v of V){
    let sc=0, matched=[];
    for(const key of v.keys){ const s=scoreWord(qv,qk,key); if(s>0){ if(s>sc) sc=s; if(s>=40) matched.push(key.w) } }
    if(qa.length>=3 && v.txt.includes(qa)) { sc=Math.max(sc, multi?90:30); }
    if(sc>=30) hits.push({v,sc,matched});
  }
  hits.sort((a,b)=>b.sc-a.sc || (a.v.bk===b.v.bk?a.v.n-b.v.n:(a.v.bk==="m"?-1:1)));
  return {hits:hits.slice(0,80), rules:rules(qa)};
}
// قواعد عامة قد تنطبق على الكلمة وإن لم تُذكر بعينها
function rules(qa){
  const w = strips(qa).sort((a,b)=>a.length-b.length)[0] || qa;
  const out=[];
  if(/ات$/.test(w) && w.length>=4) out.push({t:"إن كانت جمع مؤنث سالمًا", d:"يُحذف ألفه في الرسم إذا تكرّر، ما لم يكن مشدّدًا أو مهموزًا، وفي الجمع الذي فيه ألفان تفصيل.", r:["m:48","m:50","m:52","m:53"]});
  if(/(ين|ون)$/.test(w) && w.length>=5 && /^.?.?ا/.test(w.replace(/^ال/,""))) out.push({t:"إن كانت جمع مذكر سالمًا", d:"حُذفت ألفه في الرسم حيث أتى، كالعالمين والصادقين، بالشرط المذكور.", r:["m:48","m:50","m:73"]});
  if(/ان$/.test(w) && w.length>=5) out.push({t:"إن كانت مثنّى", d:"تُحذف ألف المثنّى إذا لم تكن في الطرف، كـ«رجلان» و«يحكمان».", r:["m:117"]});
  if(/^(الل|لل)/.test(qa) && !/^الله/.test(qa)) out.push({t:"ما بين لامين", d:"تُحذف الألف إذا وقعت بين لامين.", r:["m:150"]});
  if(/^(يا|ها)/.test(w) && w.length>=4) out.push({t:"ياء النداء وهاء التنبيه", d:"تُحذف الألف بعد «يا» النداء و«ها» التنبيه، كـ«هٰتين» و«يٰنساء».", r:["m:151"]});
  return out;
}

// ---- rendering -----------------------------------------------------------
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function markHalf(text, v, qset){
  return text.split(/(\s+)/).map(tok=>{
    if(!tok.trim()) return tok;
    const a=A(tok); if(!a) return esc(tok);
    const tv=strips(a), tk=tv.map(K);
    let isQ=false;
    for(const key of v.keys){
      for(const kw of key.a.split(" ")){ // multi-word keys mark each word
        const ka=strips(kw), kk=ka.map(K);
        if(tv.some(x=>ka.includes(x)) || (tk.some(x=>x.length>=2&&kk.includes(x)))) { isQ=true; break }
      }
      if(isQ) break;
    }
    let isHit=false;
    if(qset) isHit = tv.some(x=>qset.a.includes(x)) || tk.some(x=>x.length>=4&&qset.k.includes(x));
    let cls=(isQ?"q ":"")+(isHit?"hit":"");
    return cls.trim()?`<span class="${cls.trim()}">${esc(tok)}</span>`:esc(tok);
  }).join("");
}

  return `<div class="bayt${small?" small":""}"><div class="sadr">${markHalf(v.s,v,qset)}</div><div class="ajz">${markHalf(v.a,v,qset)}</div></div>`;
}

  </div>
  ${Object.keys(SH.books).length?`<div class="grp">الشروح دون إنترنت</div>`:""}
  <div class="set"${Object.keys(SH.books).length?"":" hidden"}>${Object.entries(SH.books).filter(([b,B])=>!B.nodl).map(([b,B])=>`<div class="dl"><div class="tx">${esc(B.t)}<span>${esc(B.a)} · ${B.n.toLocaleString("ar-EG")} صفحة · نحو ${B.mb} م.ب</span></div><button data-dl="${b}">تنزيل</button></div>`).join("")}</div>
  <div class="set about"><p><b>المحتوى:</b> «مورد الظمآن في رسم أحرف القرآن» و«الذيل في الضبط» لأبي عبد الله محمد بن محمد الشريشي الخرّاز (ت 718هـ)، 608 أبيات؛ و«الإعلان بتكميل مورد الظمآن» لابن عاشر (ت 1040هـ)، 46 بيتًا.</p>
  <p><b>مصدر النص:</b> ملف «مذكرة شرح مورد الظمآن»، مقابَلًا بتحقيق د. أشرف محمد فؤاد طلعت (مكتبة الإمام البخاري، ط2، 1434هـ)، وعلى ترقيمه. الكلمات القرآنية في الأبيات بالأحمر كما في تلك الطبعة.</p>
  ${Object.values(SH.books).map(B=>`<p><b>${esc(B.t)}:</b> ${esc(B.src)}</p>`).join("")}
  <p><b>المصحف:</b> نص المصحف وخطّه برواية ورش عن نافع من مجمع الملك فهد لطباعة المصحف الشريف (الإصدار 10). علامات الضبط فيه على اصطلاح المجمع، وقد تختلف عن الضبط المغربي في بعض العلامات.</p>
  <p><b>البحث:</b> يبحث في فهرس الكلمات القرآنية المذكورة في كل بيت، ثم في نص الأبيات. لا يغني عن الرجوع إلى الشروح، خاصة في القواعد العامة التي لا يذكر الناظم كل كلماتها.</p></div>`;
}


// ---- الشروح: صور صفحات الكتب ------------------------------------------------
const SH = DATA.sh || {books:{},map:{}};
// رقم الصفحة المطبوع من رقم صورة الصفحة
function pr(b,i){ const B=SH.books[b]; let seg=null; for(const s of B.seg) if(i>=s[0]) seg=s; if(!seg) return {t:"",n:null};
  const n=i-seg[0]+seg[1]; return {n, t:(seg[2]?seg[2]+" · ":"")+"ص "+n.toLocaleString("ar-EG")} }
function shuruhHTML(v){
  const m=SH.map[v.id]; if(!m) return "";
  const ks=Object.keys(SH.books).filter(b=>m[b]); if(!ks.length) return "";
  return `<div class="grp">الشروح</div><div class="shl">${ks.map(b=>{ const B=SH.books[b], [s,e,g0,g1]=m[b];
    const grp = g1>g0 ? `شرح الأبيات ${g0}–${g1}` : `شرح البيت ${g0}`;
    const ps=pr(b,s), pe=pr(b,e), ar=x=>x.toLocaleString("ar-EG");
    const pg = (ps.t || "صفحة "+ar(s)) + (e>s ? " إلى "+ar(ps.t? (pe.n??e) : e) : "");
    return `<button class="shb" data-pg="${b}:${s}:${v.id}"><span class="ic">${B.ic}</span><span class="tx"><b>${esc(B.t)}</b><span>${esc(B.a)} · ${grp} · ${pg}</span></span><span class="go">‹</span></button>` }).join("")}</div>
    <div class="shnote">تفتح صفحة الكتاب التي يبدأ فيها شرح البيت، وتقلّب منها إلى ما بعدها.</div>`;
}
// أي الأبيات يبدأ شرحها في صفحة معينة
const PAGE_V = {};
for(const [id,m] of Object.entries(SH.map)) for(const b in m){ const k=b+":"+m[b][0]; (PAGE_V[k]=PAGE_V[k]||[]).includes(id)||PAGE_V[k].push(id) }
const VW = {b:null,i:0,from:null};
function openPage(b,i,from){
  const B=SH.books[b]; i=Math.max(1,Math.min(B.n,i)); VW.b=b; VW.i=i; if(from!==undefined) VW.from=from;
  $("#vt").textContent=B.t; const p=pr(b,i); $("#vs").textContent= p.t ? p.t+"  ("+i.toLocaleString("ar-EG")+" من "+B.n.toLocaleString("ar-EG")+")" : "صفحة "+i.toLocaleString("ar-EG")+" من "+B.n.toLocaleString("ar-EG");
  $("#vin").value=p.n??i;
  const box=$("#vimg"); box.innerHTML=`<div class="ld">جارٍ تحميل الصفحة…</div>`;
  const img=new Image(); img.alt="صفحة "+i; img.decoding="async";
  img.onload=()=>{ if(VW.b===b&&VW.i===i){ box.innerHTML=""; box.appendChild(img); box.scrollTop=0; box.scrollLeft=box.scrollWidth } };
  img.onerror=()=>{ if(VW.b===b&&VW.i===i) box.innerHTML=`<div class="ld">تعذّر تحميل الصفحة. تأكد من الاتصال بالإنترنت، أو نزّل الكتاب من الإعدادات ليعمل دون إنترنت.</div>` };
  img.src=B.dir+i+".png";
  for(const d of [1,2,-1]){ const j=i+d; if(j>=1&&j<=B.n){ const pre=new Image(); pre.src=B.dir+j+".png" } }
  $("#vprev").disabled=i<=1; $("#vnext").disabled=i>=B.n;
  const vs=(PAGE_V[b+":"+i]||[]).map(id=>byId[id]).filter(Boolean).sort((x,y)=>x.n-y.n);
  $("#vch").innerHTML = vs.length ? `<span>يبدأ هنا شرح:</span>`+vs.map(u=>`<button class="chip" data-vgo="${u.id}">البيت ${numLabel(u)}</button>`).join("") : "";
  $("#viewer").classList.add("on");
}
function closePage(){ $("#viewer").classList.remove("on"); $("#vimg").classList.remove("zoom"); $("#vz").textContent="تكبير" }
$("#vx").addEventListener("click",closePage);
$("#vprev").addEventListener("click",()=>openPage(VW.b,VW.i-1));
$("#vnext").addEventListener("click",()=>openPage(VW.b,VW.i+1));
$("#vz").addEventListener("click",()=>{ const z=$("#vimg").classList.toggle("zoom"); $("#vz").textContent=z?"تصغير":"تكبير"; if(z){const b=$("#vimg"); b.scrollLeft=b.scrollWidth} });
$("#vin").addEventListener("change",e=>{ const n=parseInt(String(e.target.value).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))); if(!n) return;
  // الرقم المكتوب هو رقم الصفحة المطبوع في الجزء الحالي
  const B=SH.books[VW.b]; let seg=null; for(const s of B.seg) if(VW.i>=s[0]) seg=s; openPage(VW.b, seg? n-seg[1]+seg[0] : n); e.target.blur() });
$("#vch").addEventListener("click",e=>{ const c=e.target.closest("[data-vgo]"); if(c){ closePage(); openVerse(c.dataset.vgo) } });
// السحب: من اليسار إلى اليمين = الصفحة التالية (كتقليب الكتاب العربي)
(()=>{ let x0=null,y0=0,t0=0; const el=$("#vimg");
  el.addEventListener("touchstart",e=>{ if(e.touches.length!==1||el.classList.contains("zoom")){x0=null;return} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now() },{passive:true});
  el.addEventListener("touchend",e=>{ if(x0===null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6 && Date.now()-t0<700 && (visualViewport?visualViewport.scale<=1.01:true)) openPage(VW.b, VW.i+(dx>0?1:-1)) },{passive:true});
})();
document.addEventListener("keydown",e=>{ if(!$("#viewer").classList.contains("on")) return;
  if(e.key==="Escape") closePage(); if(e.key==="ArrowLeft") openPage(VW.b,VW.i+1); if(e.key==="ArrowRight") openPage(VW.b,VW.i-1) });

// تنزيل صفحات كتاب للعمل دون إنترنت
const PCACHE="mawrid-pages";
async function cachedCount(b){ try{ const c=await caches.open(PCACHE); const ks=await c.keys(); const d=SH.books[b].dir; return ks.filter(r=>new URL(r.url).pathname.includes("/"+d)).length }catch(e){ return 0 } }
async function download(b,btn){
  if(!("caches" in window)){ toast("المتصفح لا يدعم التنزيل"); return }
  const B=SH.books[b], c=await caches.open(PCACHE); let done=0, fail=0; btn.disabled=true;
  const todo=[]; for(let i=1;i<=B.n;i++) todo.push(i);
  async function worker(){ while(todo.length){ const i=todo.shift(); const u=B.dir+i+".png";
      try{ if(!(await c.match(u))){ const r=await fetch(u); if(r.ok) await c.put(u,r); else fail++ } }catch(e){ fail++ }
      done++; if(done%10===0||done===B.n) btn.textContent=Math.round(done*100/B.n)+"٪" } }
  await Promise.all([worker(),worker(),worker(),worker()]);
  btn.disabled=false; btn.textContent= fail? "أكمل التنزيل" : "نُزّل ✓"; btn.classList.toggle("ok",!fail);
  toast(fail? "انقطع التنزيل، أعد المحاولة" : "صار «"+B.t+"» متاحًا دون إنترنت");
}
async function fillDL(){
  for(const b of Object.keys(SH.books)){ const btn=document.querySelector(`[data-dl="${b}"]`); if(!btn) continue;
    const n=await cachedCount(b), N=SH.books[b].n; if(n>=N){ btn.textContent="نُزّل ✓"; btn.classList.add("ok") } else if(n>N*0.1) btn.textContent="أكمل التنزيل" }
}
document.addEventListener("click",e=>{ const d=e.target.closest("[data-dl]"); if(d&&!d.disabled&&!d.classList.contains("ok")) download(d.dataset.dl,d) });

// ---- verse sheet ---------------------------------------------------------
function openVerse(id){
  const v=byId[id]; if(!v) return; const s=secOf(v); const qs=qsetOf($("#q").value);
  let ctx=""; for(let n=v.n-2;n<=v.n+2;n++){ const u=byId[v.bk+":"+n]; if(!u) continue;
    ctx+=`<div class="row${n===v.n?" cur":""}" data-id="${u.id}"><div class="vhead"><span class="vnum">${numLabel(u)}</span></div>${baytHTML(u,n===v.n?qs:null,n!==v.n)}</div>` }
  $("#sheetpn").innerHTML=`<div class="grab"></div><button class="vbtn" data-close style="float:left;font-size:22px;line-height:1;margin-top:-4px" aria-label="إغلاق">×</button>
   <div class="vhead"><span class="vsec">${esc(bookName(v))} · ${esc(s?s.t:"")}</span>
   <button class="vbtn bm${BM.has(v.id)?" on":""}" data-bm="${v.id}">${BM.has(v.id)?ICON_BM:ICON_BM0}</button>
   <button class="vbtn" data-copy="${v.id}" aria-label="نسخ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
   <div class="card ctx">${ctx}</div>
   ${v.w.length?`<div class="grp">الكلمات القرآنية في البيت</div><div class="chips">${v.w.map(w=>`<button class="chip q" data-s="${esc(w)}">${esc(w)}</button>`).join("")}</div>`:""}
   ${shuruhHTML(v)}
   <div class="navrow"><button data-go="${v.bk}:${v.n-1}" ${byId[v.bk+":"+(v.n-1)]?"":"disabled"}>→ البيت السابق</button><button data-go="${v.bk}:${v.n+1}" ${byId[v.bk+":"+(v.n+1)]?"":"disabled"}>البيت التالي ←</button></div>`;
  $("#sheet").classList.add("on"); $("#sheetpn").scrollTop=0;
}
function closeSheet(){ $("#sheet").classList.remove("on") }

// ---- state & events ------------------------------------------------------
function $(s){return document.querySelector(s)}
const state = Object.assign({view:"search",book:"r",fs:"m",theme:"auto"}, (()=>{try{return JSON.parse(localStorage.getItem("mawrid.ui")||"{}")}catch(e){return{}}})());
if(state.fz===undefined) state.fz={s:-2,l:3}[state.fs]||0; // ترحيل الإعداد القديم
function saveUI(){ try{ localStorage.setItem("mawrid.ui",JSON.stringify({book:state.book,fz:state.fz,theme:state.theme,bold:state.bold})) }catch(e){} }
function applyUI(){
  const r=document.documentElement;
  if(state.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",state.theme);
  const base = matchMedia("(max-width:420px)").matches?17:(matchMedia("(min-width:900px)").matches?23:21);
  r.style.setProperty("--fs",(base+state.fz*2)+"px");
  r.style.setProperty("--ui",(16+state.fz)+"px");
  r.classList.toggle("bold", state.bold!==false);
}
function show(view){
  state.view=view;
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+view));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="saved") renderSaved();
  if(view==="set") { renderSettings(); fillDL(); }
  if(view==="browse" && !$("#browse").innerHTML) renderBrowse();
  scrollTo(0,0);
}
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),1400) }
function doSearch(w){ $("#q").value=w; QF={form:null,lim:12}; closeSheet(); show("search"); renderSearch(); }

let deb; $("#q").addEventListener("input",()=>{ clearTimeout(deb); QF={form:null,lim:12}; deb=setTimeout(()=>{ if(state.view!=="search") show("search"); renderSearch() },160) });
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") e.target.blur() });
$("#clr").addEventListener("click",()=>{ $("#q").value=""; renderSearch(); $("#q").focus() });
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.v) });
$("#seg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.book=b.dataset.b; saveUI();
  document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b)); renderBrowse() });
$("#browse").addEventListener("toggle",e=>{ if(e.target.open) fillSec(e.target.querySelector(".secbody")) },true);
$("#sheetbd").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet() });
document.addEventListener("click",e=>{
  const bm=e.target.closest("[data-bm]");
  if(bm){ const id=bm.dataset.bm; if(BM.has(id)) BM.delete(id); else BM.add(id); saveBM();
    document.querySelectorAll(`[data-bm="${id}"]`).forEach(x=>{x.classList.toggle("on",BM.has(id)); x.innerHTML=BM.has(id)?ICON_BM:ICON_BM0});
    toast(BM.has(id)?"حُفظ البيت":"أُزيل من المحفوظات"); if(state.view==="saved"&&!$("#sheet").classList.contains("on")) renderSaved(); return }
  const cp=e.target.closest("[data-copy]");
  if(cp){ const v=byId[cp.dataset.copy]; const t=`${v.s}   ${v.a}\n— ${bookName(v)}، البيت ${v.n}`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ البيت"),()=>toast("تعذّر النسخ")); return }
  if(e.target.closest("[data-close]")){ closeSheet(); return }
  const pg=e.target.closest("[data-pg]"); if(pg){ const [b,i,id]=pg.dataset.pg.split(/:(\d+):/); openPage(b,+i,id); return }
  const ch=e.target.closest("[data-s]"); if(ch){ doSearch(ch.dataset.s); return }
  const go=e.target.closest("[data-go]"); if(go){ if(!go.disabled) openVerse(go.dataset.go); return }
  if(e.target.closest("[data-bold]")){ state.bold = state.bold===false; saveUI(); applyUI(); toast(state.bold!==false?"خط عريض":"خط عادي"); return }
  const fz=e.target.closest("[data-fz]"); if(fz){ const d=+fz.dataset.fz; state.fz = d===0?0:Math.max(-3,Math.min(8,state.fz+d)); saveUI(); applyUI();
    if(state.view==="set") { renderSettings(); fillDL(); } toast(state.fz===0?"الحجم الأصلي":(state.fz>0?"تكبير ":"تصغير ")+Math.abs(state.fz)); return }
  const th=e.target.closest("[data-th]"); if(th){ state.theme=th.dataset.th; saveUI(); applyUI(); renderSettings(); fillDL(); return }
  if(e.target.closest("summary")) return;
  const row=e.target.closest("[data-id]"); if(row){ openVerse(row.dataset.id) }
});

applyUI(); renderSearch(); loadQ();
if(state.book!=="r") document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x.dataset.b===state.book));
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
